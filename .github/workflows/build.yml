# CodeArts CPA 插件的多平台构建与发布。
#
#   - 推 tag 'v*'        → 发布该版本（官方插件商店只认 v<version> 这个形状）
#   - workflow_dispatch  → 手动指定版本发布
#   - push / PR          → 只跑测试与构建，上传 artifact，不发布
#
# 产物命名对齐 CLIProxyAPI pluginstore 的 ArchiveName()：
#   <id>_<version>_<goos>_<goarch>.zip   （zip 根目录是 codearts.so|.dylib|.dll）

name: Build

on:
  pull_request:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v；留空则读 VERSION 文件）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate registry.json
        run: python3 scripts/validate-registry.py registry.json
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: codearts ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < VERSION)"
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=codearts.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=codearts_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=codearts_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        env:
          # clang 默认用构建机的 macOS 版本作为 deployment target，
          # 显式压到 Go 1.26 仍支持的 11.0，避免老系统拒载。
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.goos == 'darwin' && '11.0' || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" ./internal
          rm -f dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Check exported entry point (Linux)
        if: matrix.goos == 'linux'
        run: nm -D "dist/${LIB_NAME}" | grep cliproxy_plugin_init

      - name: Package plugin (CPA ArchiveName)
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            TAG="v${V}"
          else
            V="${GITHUB_REF_NAME#v}"
            # 用推上来的那个 tag 发布，商店读的就是它。
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (version $V)"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/codearts_${VERSION}_*.zip* out/ 2>/dev/null || true
          ls -la out/
          if ls out/*.sha256 >/dev/null 2>&1; then
            cat out/*.sha256 | sort > out/checksums.txt
          else
            (cd out && sha256sum *.zip > checksums.txt)
          fi
          cat out/checksums.txt
          # 缺任何一个平台，发出去的 registry 都会指向不存在的包。
          for t in linux_amd64 linux_arm64 darwin_arm64 windows_amd64; do
            test -f "out/codearts_${VERSION}_${t}.zip" || { echo "missing codearts_${VERSION}_${t}.zip"; exit 1; }
          done

      - name: Stamp registry.json with the released version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          v = os.environ["VERSION"]
          p = pathlib.Path("registry.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          for plug in data.get("plugins", []):
              if plug.get("id") == "codearts":
                  plug["version"] = v
                  plug["release_tag"] = f"v{v}"
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY
          python3 scripts/validate-registry.py registry.json
          # release 里也带一份：分支版本靠人工同步，release 附件才是权威。
          cp registry.json out/registry.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag -a "${TAG}" -m "Release codearts v${VERSION}"
              git push origin "${TAG}"
            fi
          fi
          NOTES=$(cat <<EOF
          ## CodeArts CPA v${VERSION}

          华为云 CodeArts Agent（盘古助手 / 码道）的 CLIProxyAPI 插件。

          为 [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI) 插件商店
          （\`github-release\` 安装类型）提供的多平台产物。

          ### 产物（pluginstore \`ArchiveName(id, version, goos, goarch)\`）
          | 文件 | 内容 |
          |---|---|
          | \`codearts_${VERSION}_linux_amd64.zip\` | \`codearts.so\` |
          | \`codearts_${VERSION}_linux_arm64.zip\` | \`codearts.so\` |
          | \`codearts_${VERSION}_darwin_arm64.zip\` | \`codearts.dylib\` |
          | \`codearts_${VERSION}_windows_amd64.zip\` | \`codearts.dll\` |
          | \`checksums.txt\` | 各 zip 的 SHA-256 |
          | \`registry.json\` | 对应版本的插件源清单 |

          ### 通过插件源安装
          \`\`\`
          ${REPO_URL}/releases/latest/download/registry.json
          \`\`\`
          或分支副本：\`${REPO_URL}/raw/main/registry.json\`

          ### 手动安装（linux/amd64）
          \`\`\`bash
          unzip codearts_${VERSION}_linux_amd64.zip
          cp codearts.so /path/to/cliproxyapi/plugins/codearts.so
          \`\`\`
          EOF
          )
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/*.zip out/checksums.txt out/registry.json --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/*.zip out/checksums.txt out/registry.json \
              --repo "${GITHUB_REPOSITORY}" \
              --title "CodeArts CPA v${VERSION}" \
              --notes "${NOTES}"
          fi
