name: Build CPA plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            extension: so
          - os: windows-latest
            extension: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build codearts.${{ matrix.extension }}
        run: go build -buildmode=c-shared -o codearts.${{ matrix.extension }} ./plugin/codearts
        env:
          CGO_ENABLED: '1'
      - name: Check exported entry point (Linux)
        if: runner.os == 'Linux'
        run: nm -D codearts.so | grep cliproxy_plugin_init
      - name: Check exported entry point (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships no objdump; walk the PE export directory instead
          # so the check fails only when the C ABI entry point is really missing.
          $bytes = [System.IO.File]::ReadAllBytes('codearts.dll')
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24)
          $sectionCount = [System.BitConverter]::ToUInt16($bytes, $peOffset + 6)
          $optionalHeaderSize = [System.BitConverter]::ToUInt16($bytes, $peOffset + 20)
          # Data directories follow the fixed optional header, before section headers.
          $dataDir = $peOffset + 24 + ($(if ($magic -eq 0x20B) { 112 } else { 96 }))
          $exportRva = [System.BitConverter]::ToUInt32($bytes, $dataDir)
          if ($exportRva -eq 0) { throw 'no export directory found' }
          $sections = $peOffset + 24 + $optionalHeaderSize
          function Convert-Rva([int]$rva) {
            for ($i = 0; $i -lt $sectionCount; $i++) {
              $header = $sections + 40 * $i
              $virtualSize = [System.BitConverter]::ToUInt32($bytes, $header + 8)
              $virtualAddress = [System.BitConverter]::ToUInt32($bytes, $header + 12)
              $rawSize = [System.BitConverter]::ToUInt32($bytes, $header + 16)
              $rawPointer = [System.BitConverter]::ToUInt32($bytes, $header + 20)
              $span = [Math]::Max($virtualSize, $rawSize)
              if ($rva -ge $virtualAddress -and $rva -lt $virtualAddress + $span) { return $rawPointer + ($rva - $virtualAddress) }
            }
            throw "RVA $rva is outside every section"
          }
          $exportOffset = Convert-Rva $exportRva
          $nameCount = [System.BitConverter]::ToInt32($bytes, $exportOffset + 24)
          $namesRva = [System.BitConverter]::ToUInt32($bytes, $exportOffset + 32)
          $namesOffset = Convert-Rva $namesRva
          $found = $false
          for ($i = 0; $i -lt $nameCount; $i++) {
            $nameRvas = Convert-Rva ([System.BitConverter]::ToUInt32($bytes, $namesOffset + 4 * $i))
            $end = $nameRvas
            while ($end -lt $bytes.Length -and $bytes[$end] -ne 0) { $end++ }
            $name = [System.Text.Encoding]::ASCII.GetString($bytes, $nameRvas, $end - $nameRvas)
            if ($name -eq 'cliproxy_plugin_init') { $found = $true }
          }
          if (-not $found) { throw 'cliproxy_plugin_init is missing from the DLL export table' }
          Write-Host 'cliproxy_plugin_init exported'
      - uses: actions/upload-artifact@v4
        with:
          name: codearts-${{ runner.os }}-amd64
          path: |
            codearts.${{ matrix.extension }}
            codearts.h
